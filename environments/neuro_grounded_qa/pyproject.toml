[project]
name = "neuro-grounded-qa"
version = "0.1.0"
description = "Verifiers v1 environment: answer Alzheimer's-centered biomedical questions only from evidence retrieved from a PrimeKG subgraph, and abstain when that evidence cannot support an answer."
readme = "README.md"
authors = [
    { name = "Kaitlin Moore", email = "232979971+kaitlinmoore@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "verifiers==0.4.1",
]

[project.optional-dependencies]
# Only for building the evidence store from the downloaded graph
# (python -m neuro_grounded_qa.data.build). Loading a built store is pure Python.
build = ["duckdb>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
